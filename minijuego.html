<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easter Egg | Parkour Challenge</title>
    <link rel="icon" type="image/svg+xml" href="assets/img/egg-favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:       #0a0a0f;
            --surface:  #111118;
            --surface2: #1a1a26;
            --border:   rgba(255,255,255,0.07);
            --text:     #e2e8f0;
            --muted:    #8892a4;
            --accent-1: #6C63FF;
            --accent-2: #00D4FF;
            --danger:   #ff4d6d;
            --gradient: linear-gradient(135deg, #6C63FF, #00D4FF);
            --glass:    rgba(255,255,255,0.04);
            --glass-b:  rgba(255,255,255,0.07);
            --shadow:   0 24px 64px rgba(0,0,0,0.55);
        }

        *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: 'Inter', -apple-system, sans-serif;
            color: var(--text);
            background: var(--bg);
            display: grid;
            place-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Ambient glow */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 15% 20%, rgba(108,99,255,0.14) 0%, transparent 55%),
                radial-gradient(ellipse 60% 50% at 85% 75%, rgba(0,212,255,0.09) 0%, transparent 55%);
            pointer-events: none;
            z-index: 0;
        }

        /* Main card */
        .wrap {
            width: min(980px, 100%);
            border-radius: 20px;
            border: 1px solid var(--glass-b);
            background: rgba(17,17,24,0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: var(--shadow);
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        /* Gradient top accent line */
        .wrap::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--gradient);
            z-index: 2;
        }

        /* Top bar */
        .topbar {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .title {
            font-family: 'Syne', sans-serif;
            font-size: clamp(18px, 2.4vw, 26px);
            font-weight: 800;
            letter-spacing: -0.02em;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .scoreboard {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .pill {
            padding: 6px 14px;
            border: 1px solid var(--glass-b);
            border-radius: 999px;
            background: var(--glass);
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: 0.01em;
        }

        .pill strong {
            color: var(--accent-2);
            margin-left: 5px;
            font-weight: 700;
        }

        /* Game area */
        .game {
            position: relative;
            height: 300px;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(108,99,255,0.06) 0%, transparent 40%),
                repeating-linear-gradient(
                    90deg,
                    rgba(255,255,255,0.015) 0,
                    rgba(255,255,255,0.015) 1px,
                    transparent 1px,
                    transparent 60px
                ),
                repeating-linear-gradient(
                    0deg,
                    rgba(255,255,255,0.015) 0,
                    rgba(255,255,255,0.015) 1px,
                    transparent 1px,
                    transparent 60px
                );
            background-color: rgba(10,10,20,0.6);
        }

        /* Ground platform */
        .game::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 74px;
            background:
                linear-gradient(180deg, transparent, rgba(108,99,255,0.08)),
                repeating-linear-gradient(
                    90deg,
                    rgba(0,212,255,0.18) 0,
                    rgba(0,212,255,0.18) 24px,
                    transparent 24px,
                    transparent 32px
                );
            border-top: 1px solid rgba(0,212,255,0.3);
            pointer-events: none;
        }

        /* Runner character */
        .runner {
            position: absolute;
            left: 72px;
            bottom: 74px;
            width: 44px;
            height: 44px;
            border-radius: 10px;
            border: 2px solid rgba(0,212,255,0.85);
            background: linear-gradient(150deg, rgba(108,99,255,0.95), rgba(0,212,255,0.85));
            box-shadow: 0 0 20px rgba(108,99,255,0.45), 0 8px 20px rgba(0,0,0,0.3);
            transform: translateY(0);
            z-index: 4;
        }

        .runner::before,
        .runner::after {
            content: "";
            position: absolute;
            top: 13px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(10,10,20,0.7);
        }

        .runner::before { left: 10px; }
        .runner::after  { right: 10px; }

        /* Obstacles */
        .obstacle {
            position: absolute;
            bottom: 74px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
            background: linear-gradient(160deg, #ff4d6d, #ff8c42);
            box-shadow: 0 6px 20px rgba(255,77,109,0.35);
            z-index: 3;
        }

        /* Status overlay */
        .status {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 16px;
            z-index: 6;
            pointer-events: none;
        }

        .status-card {
            background: rgba(10,10,15,0.82);
            border: 1px solid rgba(108,99,255,0.3);
            border-radius: 16px;
            padding: 16px 22px;
            max-width: 560px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .status-card h2 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(18px, 2.2vw, 24px);
            font-weight: 800;
            margin-bottom: 8px;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-card p {
            color: var(--muted);
            line-height: 1.6;
            font-size: 14px;
        }

        .status-card p strong {
            color: var(--text);
        }

        .status-card.hidden {
            opacity: 0;
            visibility: hidden;
            transform: translateY(6px);
            transition: all 180ms ease;
        }

        /* Lose popup */
        .lose-popup {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 200px;
            height: 200px;
            border-radius: 16px;
            border: 1px solid rgba(108,99,255,0.4);
            background: rgba(10,10,20,0.7);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            overflow: hidden;
            z-index: 10;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.85);
            pointer-events: none;
            transition: opacity 250ms ease, transform 250ms ease;
        }

        .lose-popup img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .lose-popup.is-visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            animation: pop-bounce 400ms ease;
        }

        @keyframes pop-bounce {
            0%   { transform: translate(-50%, -50%) scale(0.8); }
            55%  { transform: translate(-50%, -50%) scale(1.06); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        /* Controls bar */
        .controls {
            padding: 14px 20px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            border-top: 1px solid var(--border);
            background: rgba(10,10,15,0.4);
        }

        .help {
            color: var(--muted);
            font-size: 13px;
        }

        .help strong { color: var(--text); }

        .buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Buttons — match portfolio style */
        button, .back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 9px 18px;
            border-radius: 10px;
            border: 1px solid var(--glass-b);
            background: var(--glass);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: transform 150ms ease, border-color 150ms ease, background 150ms ease, box-shadow 150ms ease;
            position: relative;
            overflow: hidden;
        }

        button:hover, .back:hover {
            transform: translateY(-2px);
            border-color: rgba(108,99,255,0.5);
            background: rgba(108,99,255,0.12);
            box-shadow: 0 6px 20px rgba(108,99,255,0.2);
        }

        button:active, .back:active { transform: translateY(0); }

        .jump-btn {
            border-color: rgba(0,212,255,0.4);
            background: rgba(0,212,255,0.08);
            color: var(--accent-2);
        }

        .jump-btn:hover {
            border-color: var(--accent-2);
            background: rgba(0,212,255,0.15);
            box-shadow: 0 6px 20px rgba(0,212,255,0.2);
        }

        .danger {
            border-color: rgba(255,77,109,0.4);
            background: rgba(255,77,109,0.08);
            color: #ff7a92;
        }

        .danger:hover {
            border-color: var(--danger);
            background: rgba(255,77,109,0.15);
            box-shadow: 0 6px 20px rgba(255,77,109,0.2);
        }

        .back {
            border-color: rgba(108,99,255,0.35);
        }

        @media (max-width: 720px) {
            .game { height: 240px; }
            .runner { left: 52px; }
            .help { font-size: 12px; }
            .controls { flex-direction: column; align-items: flex-start; }
            .buttons { width: 100%; }
            button, .back { flex: 1; justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="topbar">
            <h1 class="title">Parkour Challenge</h1>
            <div class="scoreboard">
                <div class="pill">Puntos <strong id="score">0</strong></div>
                <div class="pill">Récord <strong id="best">0</strong></div>
                <div class="pill">Velocidad <strong id="speed">1.0x</strong></div>
            </div>
        </div>

        <section class="game" id="game" aria-label="Zona de juego">
            <div class="runner" id="runner" aria-hidden="true"></div>
            <div class="lose-popup" id="lose-popup" aria-hidden="true">
                <img src="assets/img/image.png" alt="Easter egg de derrota">
            </div>
            <div class="status">
                <div class="status-card" id="status-card">
                    <h2 id="status-title">Easter Egg desbloqueado</h2>
                    <p id="status-text">Pulsa <strong>Espacio</strong>, <strong>W</strong> o <strong>Arrow Up</strong> para saltar. Evita obstáculos y supera tu récord.</p>
                </div>
            </div>
        </section>

        <div class="controls">
            <p class="help">Tip: en móvil usa <strong>Saltar</strong>. En PC usa <strong>Espacio</strong>.</p>
            <div class="buttons">
                <button type="button" class="jump-btn" id="jump-btn">Saltar</button>
                <button type="button" class="danger" id="restart-btn">Reiniciar</button>
                <a class="back" href="index.html">← Portfolio</a>
            </div>
        </div>
    </div>

    <script>
        const game = document.getElementById("game");
        const runner = document.getElementById("runner");
        const scoreEl = document.getElementById("score");
        const bestEl = document.getElementById("best");
        const speedEl = document.getElementById("speed");
        const statusCard = document.getElementById("status-card");
        const statusTitle = document.getElementById("status-title");
        const statusText = document.getElementById("status-text");
        const losePopup = document.getElementById("lose-popup");
        const jumpBtn = document.getElementById("jump-btn");
        const restartBtn = document.getElementById("restart-btn");

        const storageKey = "parkour-best-score-v1";
        let bestScore = Number(localStorage.getItem(storageKey) || 0);
        bestEl.textContent = String(bestScore);

        const state = {
            isRunning: false,
            isGameOver: false,
            restartTimer: null,
            score: 0,
            y: 0,
            vy: 0,
            gravity: 0.0019,
            jumpForce: 0.76,
            ground: 74,
            runnerX: 72,
            runnerW: 44,
            runnerH: 44,
            obstacles: [],
            baseSpeed: 0.33,
            spawnAt: 900,
            lastTime: performance.now(),
            popupTimer: null
        };

        function showStatus(title, text) {
            statusTitle.textContent = title;
            statusText.innerHTML = text;
            statusCard.classList.remove("hidden");
        }

        function hideStatus() {
            statusCard.classList.add("hidden");
        }

        function showLosePopup() {
            if (!losePopup) return;
            if (state.popupTimer) clearTimeout(state.popupTimer);
            losePopup.classList.remove("is-visible");
            void losePopup.offsetWidth;
            losePopup.classList.add("is-visible");
            state.popupTimer = setTimeout(() => {
                losePopup.classList.remove("is-visible");
            }, 1700);
        }

        function createObstacle() {
            const obstacle = document.createElement("div");
            obstacle.className = "obstacle";
            const width = 22 + Math.random() * 26;
            const height = 30 + Math.random() * 52;
            obstacle.style.width = width + "px";
            obstacle.style.height = height + "px";
            obstacle.style.left = game.clientWidth + 30 + "px";
            game.appendChild(obstacle);
            state.obstacles.push({ el: obstacle, x: game.clientWidth + 30, w: width, h: height });
        }

        function startGame() {
            if (state.isRunning) return;
            state.isRunning = true;
            hideStatus();
        }

        function resetGame(showIntro = true) {
            state.isRunning = false;
            state.isGameOver = false;
            if (state.restartTimer) { clearTimeout(state.restartTimer); state.restartTimer = null; }
            if (state.popupTimer)   { clearTimeout(state.popupTimer);   state.popupTimer = null; }
            if (losePopup) losePopup.classList.remove("is-visible");
            state.score = 0;
            state.y = 0;
            state.vy = 0;
            state.spawnAt = 600;
            state.lastTime = performance.now();
            state.obstacles.forEach((o) => o.el.remove());
            state.obstacles = [];
            runner.style.transform = "translateY(0)";
            scoreEl.textContent = "0";
            speedEl.textContent = "1.0x";
            if (showIntro) {
                showStatus(
                    "Easter Egg desbloqueado",
                    "Pulsa <strong>Espacio</strong>, <strong>W</strong> o <strong>Arrow Up</strong> para saltar. Evita obstáculos y supera tu récord."
                );
            } else {
                hideStatus();
            }
        }

        function jump() {
            if (state.isGameOver) return;
            if (!state.isRunning) startGame();
            if (state.y <= 1) state.vy = state.jumpForce;
        }

        function endGame() {
            if (state.isGameOver) return;
            state.isRunning = false;
            state.isGameOver = true;
            const currentScore = Math.floor(state.score);
            if (state.score > bestScore) {
                bestScore = currentScore;
                localStorage.setItem(storageKey, String(bestScore));
                bestEl.textContent = String(bestScore);
                showStatus("Nuevo récord", "Has hecho <strong>" + currentScore + "</strong> puntos. Reiniciando en 0.6s...");
            } else {
                showStatus("Te la diste", "Puntos: <strong>" + currentScore + "</strong>. Reiniciando en 0.6s...");
            }
            showLosePopup();
            state.restartTimer = setTimeout(() => { resetGame(false); startGame(); }, 600);
        }

        function checkCollisions() {
            const runnerY     = state.ground + state.y;
            const runnerLeft  = state.runnerX;
            const runnerRight = state.runnerX + state.runnerW;
            const runnerBottom = runnerY;
            const runnerTop   = runnerY + state.runnerH;
            for (const obs of state.obstacles) {
                const overlapX = runnerRight > obs.x && runnerLeft < obs.x + obs.w;
                const overlapY = runnerTop > state.ground && runnerBottom < state.ground + obs.h;
                if (overlapX && overlapY) return true;
            }
            return false;
        }

        function frame(now) {
            const dt = Math.min(now - state.lastTime, 34);
            state.lastTime = now;
            if (state.isRunning) {
                state.score += dt * 0.023;
                scoreEl.textContent = String(Math.floor(state.score));
                const speedFactor = 1 + state.score / 340;
                const speed = state.baseSpeed * speedFactor * dt;
                speedEl.textContent = speedFactor.toFixed(1) + "x";
                state.vy -= state.gravity * dt;
                state.y  += state.vy * dt;
                if (state.y < 0) { state.y = 0; state.vy = 0; }
                runner.style.transform = "translateY(" + (-state.y) + "px)";
                state.spawnAt -= dt;
                if (state.spawnAt <= 0) {
                    createObstacle();
                    state.spawnAt = 780 + Math.random() * 650 - Math.min(220, state.score * 0.12);
                }
                state.obstacles = state.obstacles.filter((obs) => {
                    obs.x -= speed;
                    obs.el.style.left = obs.x + "px";
                    if (obs.x + obs.w < -30) { obs.el.remove(); return false; }
                    return true;
                });
                if (checkCollisions()) endGame();
            }
            requestAnimationFrame(frame);
        }

        function onJumpInput(event) {
            if (event) event.preventDefault();
            jump();
        }

        window.addEventListener("keydown", (event) => {
            if (event.code === "Space" || event.code === "ArrowUp" || event.code === "KeyW") onJumpInput(event);
            if (event.code === "Enter" && state.isGameOver) { resetGame(); startGame(); }
        });

        jumpBtn.addEventListener("click", onJumpInput);
        jumpBtn.addEventListener("touchstart", onJumpInput, { passive: false });
        restartBtn.addEventListener("click", () => { resetGame(); });

        resetGame();
        requestAnimationFrame(frame);
    </script>
</body>
</html>
